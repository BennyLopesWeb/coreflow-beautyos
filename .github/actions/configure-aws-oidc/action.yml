name: Configure AWS via OIDC
description: >
  Assume uma IAM Role via GitHub Actions OIDC (aws-actions/configure-aws-credentials).
  Elimina a necessidade de AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY estáticos.

inputs:
  role-to-assume:
    description: ARN da IAM Role (secret AWS_ROLE_ARN).
    required: true
  aws-region:
    description: Região AWS (ex. us-east-1).
    required: false
    default: us-east-1

runs:
  using: composite
  steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: coreflow-gha-${{ github.run_id }}
